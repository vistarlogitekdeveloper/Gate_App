name: gate_reco_app
description: Premium Flutter App (Mobile + Web) - Gate Entry & Reconciliation
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1

  # ---------- Routing ----------
  go_router: ^14.8.1

  # ---------- Networking ----------
  dio: ^5.5.0

  # ---------- Model Generation ----------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---------- Secure Storage (JWT later) ----------
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2

  # ---------- File Upload ----------
  file_picker: ^8.1.2

  # ---------- QR / Barcode Scanning (mobile only) ----------
  mobile_scanner: ^5.2.3

  # ---------- On-device text recognition (scan-to-autofill) ----------
  # Reads the challan ON THE PHONE before upload. Free, no API key, and the
  # image never leaves the device for recognition. It is built for camera
  # frames, which is exactly where the server's Tesseract struggles: every one
  # of the first ten production scans came back flagged blurred. We send the
  # recognised text AND the photo, so the server can still fall back and the
  # two engines can be compared on identical input.
  google_mlkit_text_recognition: ^0.13.0

  # ---------- Camera capture (scan-to-autofill) ----------
  # mobile_scanner above is a BARCODE analyser, not a camera; reading a
  # challan needs a full-resolution still. Camera permissions are already
  # declared on both platforms for the QR scanner, so this adds none.
  image_picker: ^1.1.2

  # ---------- Utilities ----------
  intl: ^0.20.2

  # ---------- UI ----------
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  universal_html: ^2.3.0
  data_table_2: ^2.7.2
  excel: ^4.0.6
  # Direct (already resolved transitively via excel). Used by
  # lib/features/reports/domain/services/fast_xlsx.dart to zip the sheet XML.
  archive: ^3.6.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ---------- Code Generation ----------
  build_runner: ^2.4.12
  freezed: ^2.5.8
  json_serializable: ^6.8.0

  # ---------- App Icon ----------
  flutter_launcher_icons: ^0.13.1

  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#FAF8FE"
  image: assets/images/app_icon.png
  color_dark: "#070611"
  image_dark: assets/images/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#FAF8FE"
    image: assets/images/app_icon.png
    color_dark: "#070611"
    image_dark: assets/images/app_icon.png
  web: false


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  background_color: "#070611"
  theme_color: "#E0218A"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
